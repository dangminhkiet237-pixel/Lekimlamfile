name: Run Telegram Bot (restart every 5h)
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y python3-dev gcc
      - run: pip install -r requirements.txt
      - run: python bot.py
        timeout-minutes: 350
